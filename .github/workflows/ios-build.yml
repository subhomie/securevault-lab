name: build-unsigned-ipa

# Builds SecureVault as an UNSIGNED .ipa on a macOS runner.
# Intended for TrollStore / jailbroken sideloading (no Apple cert needed).
#
# Triggers: push to main, or run manually from the Actions tab.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, Release, device)
        run: |
          xcodebuild \
            -project SecureVault.xcodeproj \
            -scheme SecureVault \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/SecureVault.app"
          test -d "$APP"
          rm -rf Payload SecureVault-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SecureVault-unsigned.ipa Payload
          ls -la SecureVault-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-unsigned-ipa
          path: SecureVault-unsigned.ipa
          if-no-files-found: error
